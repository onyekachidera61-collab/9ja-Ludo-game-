<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>9ja Ludo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <h1 id="game-title">🎲 9ja Ludo</h1>
    <div id="turn-banner">
      <span id="turn-color-dot"></span>
      <span id="turn-text">Red's Turn</span>
    </div>
    <div id="board-wrapper">
      <div id="board"><!-- 225 cells generated by JS --></div>
    </div>
    <div id="controls">
      <div id="dice-area">
        <div id="dice"><div class="pip"></div></div>
        <button id="roll-btn">🎲 Roll Dice</button>
      </div>
      <div id="game-log">
        <p class="log-entry">Welcome to 9ja Ludo! Red goes first.</p>
      </div>
      <button id="new-game-btn">🔄 New Game</button>
    </div>
  </div>
  <div id="win-overlay" class="hidden">
    <div id="win-card">
      <div id="win-trophy">🏆</div>
      <div id="win-message">Red Wins!</div>
      <div id="win-sub">Congratulations!</div>
      <button id="play-again-btn">🎲 Play Again</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
